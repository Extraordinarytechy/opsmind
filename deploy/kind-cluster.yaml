# Minimal kind cluster for running OpsMind end to end locally, at no cost.
#   kind create cluster --config deploy/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: opsmind
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # sample app NodePort
        hostPort: 30080
      - containerPort: 30090   # prometheus NodePort
        hostPort: 30090
